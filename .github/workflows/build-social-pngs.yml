name: Build Facebook PNG artwork

on:
  push:
    branches: [main]
    paths:
      - 'assets/posts/*.svg'
      - '.github/workflows/build-social-pngs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-pngs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer
        run: python -m pip install --disable-pip-version-check cairosvg
      - name: Convert SVG artwork to real PNG files
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg

          for svg in sorted(Path('assets/posts').glob('*.svg')):
              png = svg.with_suffix('.png')
              cairosvg.svg2png(url=str(svg), write_to=str(png), output_width=1080, output_height=1080)
              print(f'Created {png}')
          PY
      - name: Commit PNG artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/posts/*.png
          if git diff --cached --quiet; then
            echo "No PNG changes."
          else
            git commit -m "Render Facebook post SVGs to PNGs"
            git push
          fi
